name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # hanzi_ref.db (~28 MB) không có trong repo -> sinh từ tool/data
      - name: Build reference DB
        run: |
          mkdir -p assets/db assets/vocab_images
          python3 tool/build_db.py

      # Sinh các file Android còn thiếu (res/mipmap, styles, gradle wrapper...) giống setup.sh
      - name: Generate missing Android files
        run: |
          rm -f android/build.gradle android/settings.gradle android/app/build.gradle
          flutter create --platforms=android --org vn.hoctiengtrung --project-name hoc_tieng_trung .
          rm -rf android/app/src/main/kotlin/vn/hoctiengtrung/hoc_tieng_trung
          rm -f test/widget_test.dart
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
