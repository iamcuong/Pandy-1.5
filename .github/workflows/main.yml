name: Build Flutter SDK (Android AAR)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-aar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Environment and Build AAR
        run: |
          # 1. Định vị thư mục chứa dự án Flutter
          TARGET_DIR=$(dirname "$(find . -maxdepth 3 -name "pubspec.yaml" | head -n 1)")
          if [ -z "$TARGET_DIR" ]; then
            echo "Lỗi: Không tìm thấy file pubspec.yaml trong repository!"
            exit 1
          fi
          echo "Dự án Flutter nằm tại: $TARGET_DIR"
          cd "$TARGET_DIR"

          # 2. Xác định đường dẫn Flutter SDK trên máy ảo GitHub Actions
          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          echo "Đường dẫn Flutter SDK: $FLUTTER_ROOT"

          # 3. Tạo file local.properties cho cả android/ và .android/
          mkdir -p android
          cat > android/local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          flutter.sdk=$FLUTTER_ROOT
          EOF

          mkdir -p .android
          cat > .android/local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          flutter.sdk=$FLUTTER_ROOT
          EOF

          # 4. TỰ ĐỘNG CẬP NHẬT GRADLE LÊN 8.14.0
          echo "=== Cập nhật Gradle Wrapper lên 8.14.0 ==="
          find . -name "gradle-wrapper.properties" -exec sed -i 's/gradle-[0-9.]*-\(all\|bin\)\.zip/gradle-8.14.0-\1.zip/g' {} +
          
          # In ra kiểm tra xem giá trị mới đã được ghi hay chưa
          find . -name "gradle-wrapper.properties" -exec grep "distributionUrl" {} +

          # 5. Tải dependency và build AAR
          flutter pub get
          flutter build aar --no-debug --no-profile

      - name: Upload AAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-aar-release
          path: '**/build/host/outputs/repo/'
